name: CI

on:
  push:
    branches:
      - dev
      - init
  pull_request:
    branches:
      - dev
      - init

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-w.txt || pip install -r requirements-l.txt
          pip install pytest

      - name: Run unit tests
        run: pytest
